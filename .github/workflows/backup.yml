# Backups to the owner's Dropbox.
#  - Daily at 12:00 Asia/Riyadh (09:00 UTC): full encrypted backup, moves new
#    original images to Dropbox, removes backups older than 30 days.
#  - Every 15 minutes: does nothing unless the owner/admin pressed
#    «نسخة إلى Dropbox» in the app (one Firestore read when idle).
# GitHub may delay or drop scheduled runs under load, and disables schedules in
# public repos after 60 days without repository activity — the app shows the
# owner the last backup time and warns after 26 hours.
name: Backup

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - name: On-demand backup (only if requested in the app)
        if: github.event.schedule == '*/15 * * * *'
        run: node scripts/backup/backup.ts --requests
      - name: Daily backup
        if: github.event.schedule != '*/15 * * * *'
        run: node scripts/backup/backup.ts
